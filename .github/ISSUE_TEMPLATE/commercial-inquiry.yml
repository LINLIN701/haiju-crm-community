name: 商业合作
description: 申请专业版、企业版、独立部署或实施支持
title: "[Commercial] "
labels:
  - commercial
body:
  - type: markdown
    attributes:
      value: |
        这是公开表单。只填写可公开的概况；不要填写客户姓名、手机号、合同、密码、密钥、数据库或内部系统地址。维护者会在需要时提供非公开沟通方式。
  - type: dropdown
    id: service
    attributes:
      label: 合作方向
      options:
        - 专业版或企业版
        - 独立部署
        - 数据迁移
        - 实施与培训
        - 其他合作
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: 可公开的需求概况
      description: 例如团队规模、计划使用场景和期望时间，不要填写敏感数据。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据确认
      options:
        - label: 我已确认本表单不含客户隐私、账号凭据、密钥、合同或数据库资料。
          required: true

