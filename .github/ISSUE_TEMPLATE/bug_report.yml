name: 缺陷报告
description: 报告可复现的社区版问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先删除或替换客户姓名、手机号、密码、密钥、数据库内容和其他敏感资料。
  - type: input
    id: version
    attributes:
      label: 社区版版本
      placeholder: V1.00.01
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - 本地源码运行
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最小、稳定、已脱敏的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据确认
      options:
        - label: 我已确认内容不含真实客户数据、密码、令牌、密钥或数据库备份。
          required: true

