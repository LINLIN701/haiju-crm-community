name: 功能建议
description: 提议适合社区版边界的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述业务场景，不要提交真实客户资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: boundary
    attributes:
      label: 社区边界确认
      options:
        - label: 我已阅读 COMMERCIAL_EDITIONS.md，并理解高级 AI、自动化、多门店和商业交付能力不在社区版范围内。
          required: true

